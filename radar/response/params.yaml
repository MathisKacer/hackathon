# Règle de SIMULATION des réponses aux candidatures spontanées (T35, D6).
# ⚠️ Ce sont des HYPOTHÈSES choisies par l'équipe, pas des résultats : aucune donnée ouverte ne
# dit qui répond. Elles servent à montrer que la chaîne « données → modèle → probabilité »
# fonctionne et retrouve une vérité connue. À afficher comme « réponses simulées » partout.
#
# « Réponse » = réponse POSITIVE (entretien proposé) à une candidature spontanée.
# logit P(réponse) = constante + Σ coef × variable + u_entreprise,  u ~ N(0, sigma_entreprise²)

graine: 42
n_etudiants: 3000
candidatures_par_etudiant: 15
rayon_km: 40                 # un étudiant candidate dans ce rayon autour de chez lui
part_alternance: 0.4         # le reste vise un stage
# Les étudiants ciblent plutôt les entreprises bien notées (comme avec Radar) :
# probabilité d'être choisie ∝ exp(selection_force × c_intensite)
selection_force: 2.0

coefficients:
  constante: -2.3
  c_intensite: 1.4           # besoin data de l'entreprise (score T30)
  c_embauche: 0.5            # volume de recrutement attendu de l'établissement
  log10_effectif: -0.45      # les très grandes structures répondent moins aux spontanées
  distance_10km: -0.15       # par tranche de 10 km entre l'étudiant et l'établissement
  alternance: 0.35           # l'alternance (aides à l'embauche) favorise les réponses
  a_offre_domaine: 0.4       # l'entreprise recrute déjà dans le domaine (offre visible)
sigma_entreprise: 0.5        # hétérogénéité non observée entre entreprises

# Villes de résidence des étudiants simulés (poids ≈ effectifs étudiants, ordre de grandeur)
villes:
  - {nom: Paris,       lat: 48.8566, lon: 2.3522,  poids: 30}
