# Dictionnaire des domaines (T6) — utilisé par le classifieur d'offres (T13), l'app et le score.
#
# Codes ROME 4.0 vérifiés via l'API France Travail « ROME 4.0 – Métiers »
# (GET /partenaire/rome-metiers/v1/metiers/metier, 1 923 métiers, extrait le 2026-11-27).
# Les libellés sont recopiés tels quels depuis l'API.
#
# Règle de classement d'une offre (implémentée dans radar/domains.py › classify, base de T13) :
#   « titre OK » = le titre contient un `mots_cles` du domaine et aucune de ses `exclusions`.
#   1. code ROME dans `rome_partiel` d'un domaine ET titre OK → ce domaine
#      (code ambigu : « Chargé d'études commerciales » est marketing, sauf s'il parle de data) ;
#   2. sinon, code ROME dans `rome` d'un domaine              → ce domaine ;
#   3. sinon (pas de code, cas d'Adzuna), titre OK            → ce domaine ;
#   4. sinon → `autre`.
#   À chaque étape, les domaines sont essayés dans l'ordre de ce fichier (data d'abord).
#
# Mots-clés : expressions régulières Python, insensibles à la casse, appliquées au titre.
# Un code n'apparaît que dans le `rome` d'un seul domaine (vérifié par tests/test_domains.py).
# Pour ajouter un domaine : copier un bloc, puis lancer `uv run pytest tests/test_domains.py`.

