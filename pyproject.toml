[project]
name = "radar"
version = "0.1.0"
description = "Radar : trouver les entreprises qui ont besoin de ton profil, même sans offre publiée."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "requests>=2.32",
    "requests-cache>=1.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "streamlit>=1.40",
    "folium>=0.17",
    "streamlit-folium>=0.22",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
