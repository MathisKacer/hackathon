# Thème de l'app (proposition A « sobre ») : bleu nuit neutre pour que le bleu (offres) et
# l'orange (candidatures spontanées) de la carte gardent leur sens.
[theme]
base = "light"
primaryColor = "#1D3557"
backgroundColor = "#FAFAF7"
secondaryBackgroundColor = "#EEF1F5"
textColor = "#1F2933"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.6rem"
borderColor = "#E3E6EA"
showWidgetBorder = true

[client]
toolbarMode = "minimal"
