# T93 (essai, branche emma/interface-riche) : thème plus marqué, clair et sombre.
# Bleu nuit / indigo pour l'interface ; le bleu (offres) et l'orange (candidatures spontanées)
# de la carte gardent leur sens. Le mode sombre se choisit dans le menu ⋮ › Settings.
[theme]
primaryColor = "#3B5BDB"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
baseRadius = "0.8rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#3B5BDB"
backgroundColor = "#F6F7FB"
secondaryBackgroundColor = "#E9EDF7"
textColor = "#1B2333"
borderColor = "#DDE2EE"

[theme.dark]
primaryColor = "#748FFC"
backgroundColor = "#0F1422"
secondaryBackgroundColor = "#1A2133"
textColor = "#E6E9F2"
borderColor = "#2A3349"

[client]
toolbarMode = "viewer"
